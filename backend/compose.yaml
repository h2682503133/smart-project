services:
  emqx:
    image: emqx/emqx:5.8.8
    container_name: smart-agriculture-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "18083:18083"
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.4-alpine
    container_name: smart-agriculture-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mysql:
    image: mysql:8.4
    container_name: smart-agriculture-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smart_agriculture
      MYSQL_USER: smart_agriculture
      MYSQL_PASSWORD: smart_agriculture
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usmart_agriculture", "-psmart_agriculture"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  minio:
    image: minio/minio:latest
    container_name: smart-agriculture-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  redis-data:
  mysql-data:
  minio-data:
